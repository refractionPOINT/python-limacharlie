hives:
  investigation_policy:
    default:
      data:
        autonomy:
          close.false_positive:
            mode: suggest
            min_confidence: 0.90
            max_targets_per_run: 3
            max_targets_per_hour: 50
            lease: 2h
            approval_timeout: 15m
          eradicate.*:
            mode: approve
          tag.remove:
            mode: approve
      usr_mtd:
        enabled: true
        tags: [fictional-iac]
  investigation_plan:
