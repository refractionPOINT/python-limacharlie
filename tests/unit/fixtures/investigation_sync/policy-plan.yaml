hives:
  investigation_policy:
    default:
      data:
        paused: false
        circuit_breaker:
          per_hour: 20
          per_run: 5
        notify:
          action.held: ["output:fictional-slack"]
      usr_mtd:
        enabled: true
        tags: [fictional-iac]
  investigation_plan:
    fictional-triage:
      data: {}
      usr_mtd:
        enabled: true
        tags: [fictional-iac]
  investigation_pack:
    fictional_pack:
      data:
        yaml: |
          name: fictional_pack
          version: 1
          brief: A fictional shared check
          description: Reads a fictional fact.
          facts:
            f:
              op: fictional.op
          exports:
            e:
              fact: f
              path: x
      usr_mtd:
        enabled: true
        tags: [fictional-iac]
